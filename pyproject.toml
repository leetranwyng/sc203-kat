[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sc203-kat"
version = "0.3.0a1"
description = "SC203 reproducible spatial reasoning experiments and Kaggle launchers"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
sc203-kat = "sc203_kat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
