name: OneRef CPU runtime
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - configs/ablations/environments.json
      - src/sc203_kat/ablation/perception.py
      - scripts/check_oneref_runtime.py
      - .github/workflows/oneref_runtime.yml
jobs:
  import-and-forward:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install uv==0.9.5
      - run: |
          uv venv /tmp/sc203-oneref-cpu --python 3.10
          /tmp/sc203-oneref-cpu/bin/python scripts/check_oneref_runtime.py --install
